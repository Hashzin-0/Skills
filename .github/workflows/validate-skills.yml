name: Validate Skills Registry

on:
  pull_request:
    paths:
      - "skills/**"
      - "plugins/skills-manifest.json"
      - "index.json"
      - "scripts/validate-skills-manifest.mjs"
      - ".github/workflows/validate-skills.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "plugins/skills-manifest.json"
      - "index.json"
      - "scripts/validate-skills-manifest.mjs"
      - ".github/workflows/validate-skills.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifest, skill files and registry index
        run: node scripts/validate-skills-manifest.mjs
